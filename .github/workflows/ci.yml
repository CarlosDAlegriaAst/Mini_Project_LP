name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore Parqueadero.sln
      - run: dotnet build Parqueadero.sln --no-restore -c Release
      - run: dotnet test tests/Parqueadero.Tests --no-build -c Release
